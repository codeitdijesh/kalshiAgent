name: Shipwrecked Monitor

# Polls Kalshi every 5 minutes for the "Shipwrecked" movie.
# When detected, sends email + SMS alerts (alerts only, no auto-betting).
#
# REQUIRED repo secrets (Settings → Secrets and variables → Actions):
#   EMAIL_FROM           — Gmail address for sending alerts
#   EMAIL_PASSWORD       — Gmail app password (not your regular password)
#   EMAIL_TO             — where alerts go
#   PHONE_NUMBER         — 10-digit number for SMS (optional)
#   PHONE_CARRIER        — verizon|att|tmobile|etc. (optional)
#
# Manual run: Actions tab → "Shipwrecked Monitor" → Run workflow.

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes
  workflow_dispatch:            # manual trigger

permissions:
  contents: read

jobs:
  check-shipwrecked:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-dotenv requests

      - name: Check for Shipwrecked
        env:
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          PHONE_NUMBER:   ${{ secrets.PHONE_NUMBER }}
          PHONE_CARRIER:  ${{ secrets.PHONE_CARRIER }}
        run: python shipwrecked_monitor.py --once
