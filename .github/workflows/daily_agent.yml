name: Daily Master Agent

# Runs every day at 21:00 UTC (~5 PM ET). The agent scrapes the current
# week's FlixPatrol rankings, runs the strategy + oracles, checks live
# Kalshi quotes, records paper trades, and commits the captured data back
# to the repo so nothing is ever lost.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APIFY_API_TOKEN   — TikTok oracle (Alpha Override)
#   TMDB_API_KEY      — optional
#   YOUTUBE_API_KEY   — optional
#
# Manual run: Actions tab → "Daily Master Agent" → Run workflow.

on:
  schedule:
    - cron: "0 21 * * *"      # daily data capture + signal
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prediction cycle (TV)
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python master_agent.py run --category TV
        continue-on-error: true   # a no-trade day exits 1; still commit data

      - name: Run prediction cycle (Films)
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python master_agent.py run --category Films
        continue-on-error: true

      - name: Commit captured data
        run: |
          git config user.name "kalshi-agent-bot"
          git config user.email "actions@github.com"
          git add -f data/paper_trades.json data/latest_cycle.json data/daily_rankings.csv output/dashboard.html data/kalshi_event_cache.json || true
          git diff --cached --quiet || git commit -m "Daily agent run: $(date -u +%F)"
          git push
